name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Create build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,build]"

      - name: Verify release version
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'src'
          $version = & .\.venv\Scripts\python.exe -c "from videodownloader import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $version"
          }

      - name: Run checks
        shell: pwsh
        run: .\scripts\check.ps1

      - name: Build standalone application
        shell: pwsh
        run: .\scripts\build.ps1 -Clean

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer and checksum
        shell: pwsh
        run: .\scripts\build_installer.ps1

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'installer\output' -Filter 'VideoDownloaderSetup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer artifact is missing.' }
          gh release create $env:GITHUB_REF_NAME `
            $installer.FullName `
            "$($installer.FullName).sha256" `
            --verify-tag `
            --generate-notes `
            --title "VideoDownloader $($env:GITHUB_REF_NAME.TrimStart('v'))"
