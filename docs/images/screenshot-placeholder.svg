  <rect width="1280" height="720" rx="28" fill="#eaf2ff"/>
  <rect x="80" y="62" width="1120" height="596" rx="22" fill="#ffffff" stroke="#b8c8df" stroke-width="3"/>
  <rect x="80" y="62" width="1120" height="68" rx="22" fill="#1f6feb"/>
