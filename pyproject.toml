[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-downloader"
dynamic = ["version"]
description = "A privacy-respecting Windows desktop interface for yt-dlp"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "VideoDownloader contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "PySide6>=6.8,<7",
]

[project.gui-scripts]
video-downloader = "videodownloader.main:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-qt>=4.4",
  "ruff>=0.9",
]
build = [
  "nuitka>=2.6",
  "ordered-set>=4.1",
  "zstandard>=0.23",
]

[tool.hatch.version]
path = "src/videodownloader/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/videodownloader"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that require local external tools or network access",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["videodownloader"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["videodownloader"]
mypy_path = "src"
exclude = ["tests/integration"]
